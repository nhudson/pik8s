---
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: DNSResolverUnavailable
        exp_alerts:
          - exp_labels:
              deployment: k8s-gateway
              namespace: network
              severity: critical
            exp_annotations:
              summary: The internal DNS resolver is unavailable.
              description: The internal DNS deployment has no available replica.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#dns-resolver-unavailable
      - eval_time: 20m
        alertname: CloudflareTunnelUnavailable
        exp_alerts:
          - exp_labels:
              deployment: cloudflared
              namespace: network
              severity: critical
            exp_annotations:
              summary: All tunnel replicas are unavailable.
              description: The external tunnel deployment has no available replica.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#cloudflare-tunnel-unavailable
      - eval_time: 20m
        alertname: CriticalWorkloadUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A deployment has unavailable replicas.
              description: A deployment has not met its desired available replica count for fifteen minutes.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#critical-workload-unavailable
      - eval_time: 30m
        alertname: CloudNativePGBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The latest database backup is stale.
              description: CloudNativePG has not reported an available backup within the expected recovery window.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#cloudnativepg-backup-stale
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="network",deployment="k8s-gateway"}'
        values: 1x30
      - series: 'kube_deployment_spec_replicas{namespace="network",deployment="cloudflared"}'
        values: 2x30
      - series: 'kube_deployment_spec_replicas{namespace="media",deployment="example"}'
        values: 1x30
      - series: 'kube_deployment_status_replicas_available{namespace="media",deployment="example"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: DNSResolverUnavailable
        exp_alerts:
          - exp_labels:
              deployment: k8s-gateway
              namespace: network
              severity: critical
            exp_annotations:
              summary: The internal DNS resolver is unavailable.
              description: The internal DNS deployment has no available replica.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#dns-resolver-unavailable
      - eval_time: 20m
        alertname: CloudflareTunnelUnavailable
        exp_alerts:
          - exp_labels:
              deployment: cloudflared
              namespace: network
              severity: critical
            exp_annotations:
              summary: All tunnel replicas are unavailable.
              description: The external tunnel deployment has no available replica.
              runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#cloudflare-tunnel-unavailable
      - eval_time: 20m
        alertname: CriticalWorkloadUnavailable
        exp_alerts: []
