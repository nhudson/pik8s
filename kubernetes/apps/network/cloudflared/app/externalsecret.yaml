---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-secret
  annotations:
    secrets-migration.pik8s.dev/phase: ownership-handoff
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: cloudflared-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      data:
        TUNNEL_ID: '{{ index . "TUNNEL_ID" }}'
        credentials.json: '{{ index . "credentials.json" }}'
  dataFrom:
    - extract:
        key: cloudflared-secret
