---
# Ownership handoff: keep the target independent from the ExternalSecret so it
# survives controller deletion, and keep the inactive SOPS file for rollback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: github-webhook-token-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      data:
        token: "{{ .token }}"
  dataFrom:
    - extract:
        key: github-webhook-token-secret
