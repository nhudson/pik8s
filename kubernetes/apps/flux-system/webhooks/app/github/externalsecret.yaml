---
# Phase 1 dual-write: the SOPS Secret remains the rollback source until this
# ExternalSecret is verified Ready after merge.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: github-webhook-token-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
  dataFrom:
    - extract:
        key: github-webhook-token-secret
