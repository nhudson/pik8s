---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: alertmanager-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        bot_token: "{{ .telegram_bot_token }}"
        alertmanager.yaml: |-
          global:
            resolve_timeout: 5m
          route:
            receiver: telegram-and-hermes
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: discard
                matchers:
                  - alertname="CPUThrottlingHigh"
                  - namespace="monitoring"
                  - container="grafana-sc-dashboard"
              - receiver: discard
                matchers:
                  - alertname=~"Watchdog|InfoInhibitor"
          receivers:
            - name: discard
            - name: telegram-and-hermes
              telegram_configs:
                - bot_token_file: /etc/alertmanager/secrets/alertmanager-config/bot_token
                  chat_id: {{ .telegram_chat_id }}
                  send_resolved: true
              webhook_configs:
                - url: http://hermes-alert-relay.monitoring.svc.cluster.local:8080/alerts
                  send_resolved: true
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .relay_bearer_token }}"
  dataFrom:
    - extract:
        key: monitoring-alerts
