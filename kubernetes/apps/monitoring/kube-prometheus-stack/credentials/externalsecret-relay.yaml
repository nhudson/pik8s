---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-alert-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: hermes-alert-relay
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        webhook_url: "{{ .hermes_webhook_url }}"
        webhook_secret: "{{ .hermes_webhook_secret }}"
        bearer_token: "{{ .relay_bearer_token }}"
  dataFrom:
    - extract:
        key: monitoring-alerts
