---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-network-alerts
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: home-network
      rules:
        - alert: HomeNetworkExporterDown
          expr: up{job="home-network"} == 0 or absent(up{job="home-network"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: The private home-network observer is unreachable.
            description: Prometheus has been unable to scrape the wireless-side observer for more than ten minutes.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-exporter-down
        - alert: HomeNetworkProbeStale
          expr: |-
            (up{job="home-network"} == 1)
            unless on (job, instance)
            (lan_monitor_last_probe_timestamp_seconds{job="home-network"} >= time() - 300)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Home-network probe results are stale.
            description: The observer remains scrapeable but has not completed a probe cycle in the expected window.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-probe-stale
        - alert: HomeNetworkInventoryInvalid
          expr: |-
            (up{job="home-network"} == 1)
            unless on (job, instance)
            (lan_monitor_config_valid{job="home-network"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: The private home-network inventory is invalid.
            description: The observer cannot load its private target configuration and is retaining the last usable result set.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-inventory-invalid
        - alert: HomeNetworkTargetMetricsMissing
          expr: |-
            (up{job="home-network"} == 1)
            unless on (job, instance)
            lan_monitor_target_up{job="home-network"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Home-network target metrics are missing.
            description: The observer is scrapeable but is not exposing any target health series.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-target-metrics-missing
        - alert: HomeNetworkCriticalTargetUnavailable
          expr: |-
            (lan_monitor_target_up{job="home-network",alert="critical"} == 0)
            and on (job, instance)
            (up{job="home-network"} == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: A critical home-network target is unavailable.
            description: A critical pseudonymous target has failed its local probe for more than fifteen minutes.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-target-unavailable
        - alert: HomeNetworkManagedTargetUnavailable
          expr: |-
            (lan_monitor_target_up{job="home-network",alert="warning"} == 0)
            and on (job, instance)
            (up{job="home-network"} == 1)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: A managed home-network target is unavailable.
            description: A stable managed target has failed its local probe for more than two hours; transient clients are excluded.
            runbook_url: https://github.com/nhudson/pik8s/blob/main/docs/runbooks/monitoring/README.md#home-network-target-unavailable
