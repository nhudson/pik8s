---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.4
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-charts
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    cleanPrometheusOperatorObjectNames: true
    crds:
      enabled: true
    defaultRules:
      create: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
    alertmanager:
      enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 2
        useExistingSecret: true
        configSecret: alertmanager-config
        secrets:
          - alertmanager-config
        automountServiceAccountToken: false
        retention: 120h
        storage: {}
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        podAntiAffinity: hard
        podAntiAffinityTopologyKey: kubernetes.io/hostname
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          - action: labeldrop
            regex: (id|name|uid|container_id|image_id)
          - action: drop
            sourceLabels: [__name__]
            regex: (rest_client_request_duration_seconds_bucket|apiserver_request_duration_seconds_bucket)
    kubeStateMetrics:
      enabled: true
    prometheus:
      enabled: true
      ingress:
        enabled: false
      prometheusSpec:
        replicas: 1
        enableAdminAPI: false
        automountServiceAccountToken: true
        walCompression: true
        scrapeInterval: 60s
        evaluationInterval: 30s
        retention: 48h
        retentionSize: 8GB
        storageSpec:
          emptyDir:
            sizeLimit: 10Gi
        resources:
          requests:
            cpu: 200m
            ephemeral-storage: 1Gi
            memory: 512Mi
          limits:
            cpu: "2"
            ephemeral-storage: 10Gi
            memory: 2Gi
        ruleSelector: {}
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigSelectorNilUsesHelmValues: false
        remoteWrite: []
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
    grafana:
      enabled: false
      forceDeployDashboards: false
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              - groupVersionKind:
                  group: external-secrets.io
                  version: v1
                  kind: ExternalSecret
                metricNamePrefix: external_secret
                metrics:
                  - name: info
                    help: ExternalSecret readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
              - groupVersionKind:
                  group: tailscale.com
                  version: v1alpha1
                  kind: Connector
                metricNamePrefix: tailscale_resource
                metrics:
                  - name: info
                    help: Tailscale Connector readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      ready: [status, conditions, "[type=ConnectorReady]", status]
              - groupVersionKind:
                  group: tailscale.com
                  version: v1alpha1
                  kind: ProxyGroup
                metricNamePrefix: tailscale_resource
                metrics:
                  - name: info
                    help: Tailscale ProxyGroup readiness information.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      ready: [status, conditions, "[type=ProxyGroupReady]", status]
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - external-secrets.io
              - tailscale.com
            resources:
              - gitrepositories
              - kustomizations
              - helmreleases
              - externalsecrets
              - connectors
              - proxygroups
            verbs: [list, watch]
