---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "GitOps Validation"

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitops-validation:
    name: GitOps Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Setup validation tools
        run: brew install fluxcd/tap/flux kubeconform kustomize

      - name: Run repository validation
        shell: bash
        run: bash ./scripts/kubeconform.sh kubernetes
